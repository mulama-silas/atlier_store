# Render Blueprint — deploys the Django backend.
#
# Usage: push to GitHub, create a blueprint in Render, or run the manual
# "New Web Service -> Docker" flow. After creation, set the `sync: false`
# secrets (below) in the dashboard — Render will refuse to start until the
# required environment variables are supplied via your DATABASE_URL.
#
# See README.md for the full deployment runbook.
services:
  - type: web
    name: boutique-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health/
    autoDeploy: true

    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: LOG_FORMAT
        value: "json"
      - key: LOG_LEVEL
        value: "INFO"
      - key: AUDIT_LOG_RETENTION_DAYS
        value: "365"
      - key: USE_X_FORWARDED_FOR
        value: "True"
      # Only the deployed backend host is allowed.
      - key: DJANGO_ALLOWED_HOSTS
        value: "atlier-boutique.onrender.com"
      - key: FRONTEND_ORIGIN
        value: "https://atlier-boutique.vercel.app"
      - key: MPESA_ENV
        value: "sandbox"
      - key: SUPABASE_URL
        value: "https://ngpzjddvkgopfmghjqnv.supabase.co"
      - key: SUPABASE_STORAGE_BUCKET
        value: "product-images"

      # ---- Background work: Celery + Redis (see backend/docs/CELERY.md) ----
      # REDIS_URL is injected automatically by Render once the Redis resource
      # is linked to this service, so it is deliberately not declared here.
      #
      # The free plan cannot run a worker (render.yaml rejects `type: worker`
      # with `plan: free`), so bulk imports run inline in this web process.
      # Email delivery does not: see EMAIL_DELIVERY_MODE below.
      - key: CELERY_WORKER_ENABLED
        value: "false"

      # ---- Outbound email (see backend/docs/CELERY.md) ----------------------
      # DEACTIVATED: nothing is sent and no row is ever marked SENT, but the
      # mailer itself is still there — queue_email keeps writing EmailLog rows
      # so the admin email page shows what would have gone out. Flip to "true"
      # once RESEND_API_KEY is set and the sending domain is verified.
      - key: EMAIL_ENABLED
        value: "false"
      # Render's free plan blocks outbound SMTP (ports 25/465/587), so mail
      # would leave through the Resend HTTPS API on port 443 instead: set
      # RESEND_API_KEY in the dashboard (sync: false, below).
      #
      # deferred = a web request never opens a socket for mail. Rows stay
      # QUEUED and POST /api/admin/emails/sweep delivers them. CREATE THE
      # CRON JOB (cron-job.org, free) WHEN YOU ENABLE THIS, or nothing will
      # be delivered. Revert to "inline" to go back to in-request delivery.
      - key: EMAIL_DELIVERY_MODE
        value: "deferred"
      - key: EMAIL_TIMEOUT
        value: "10"
      # Mock payment gateway — completes an M-Pesa intent inside
      # create_intent so an order can reach PAID and be approved. Set to
      # "false" only once a real Daraja STK push is wired up.
      - key: PAYMENT_SANDBOX
        value: "true"

      # ---- AI shopping assistant (server-side Gemini, see PROJECT.md) ------
      # Model used by backend/assistant; must support the Interactions API.
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: ASSISTANT_RETENTION_DAYS
        value: "90"
      # Conversation rate limits for /api/assistant/*.
      - key: THROTTLE_ASSISTANT_ANON_RATE
        value: "15/minute"
      - key: THROTTLE_ASSISTANT_USER_RATE
        value: "30/minute"

      # Secrets — set each via the Render dashboard ("sync: false" values are
      # never stored in source control):
      - key: DJANGO_SECRET_KEY
        sync: false
      # Google AI Studio key. SERVER ONLY: read by Django settings and used
      # exclusively by backend/assistant; never sent to React/Vercel.
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Resend API key (https://resend.com/api-keys). Unset = mail falls back
      # to SMTP, which the free plan blocks, so nothing would be delivered.
      - key: RESEND_API_KEY
        sync: false
      # Long random token presented in the x-sweep-token header by the
      # external cron that calls /api/admin/emails/sweep.
      - key: EMAIL_SWEEP_TOKEN
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: MPESA_CALLBACK_SECRET
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false

