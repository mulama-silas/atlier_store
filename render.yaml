# Render Blueprint — deploys the Django backend.
#
# Usage: push to GitHub, create a blueprint in Render, or run the manual
# "New Web Service -> Docker" flow. After creation, set the `sync: false`
# secrets (below) in the dashboard — Render will refuse to start until the
# required environment variables are supplied via your DATABASE_URL.
#
# See README.md for the full deployment runbook.
services:
  - type: web
    name: boutique-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health/
    autoDeploy: true

    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: LOG_FORMAT
        value: "json"
      - key: LOG_LEVEL
        value: "INFO"
      - key: AUDIT_LOG_RETENTION_DAYS
        value: "365"
      - key: USE_X_FORWARDED_FOR
        value: "True"
      # Only the deployed backend host is allowed.
      - key: DJANGO_ALLOWED_HOSTS
        value: "atlier-boutique.onrender.com"
      - key: FRONTEND_ORIGIN
        value: "https://atlier-boutique.vercel.app"
      # Max compressed ZIP accepted by the admin bulk importer (500 MiB).
      - key: BULK_IMPORT_MAX_ZIP_BYTES
        value: "524288000"
      - key: MPESA_ENVIRONMENT
        value: "sandbox"
      - key: MPESA_PAYMENT_MODE
        value: "simulation"
      - key: MPESA_TRANSACTION_TYPE
        value: "CustomerPayBillOnline"
      - key: SUPABASE_URL
        value: "https://ngpzjddvkgopfmghjqnv.supabase.co"
      - key: SUPABASE_STORAGE_BUCKET
        value: "product-images"
      # Analytics replica (see supabase/replica_schema.sql). The destination
      # bucket must be created once in the dashboard as PRIVATE.
      - key: REPLICA_BACKUP_BUCKET
        value: "product-images-backup"
      # inline   = the admin button runs the sync inside the request.
      # deferred = the admin button queues a run for background processing.
      # Preferred on a free instance, where a long sync can outrun the proxy
      # timeout and an operator retrying would start a second concurrent sync.
      - key: REPLICA_SYNC_MODE
        value: "deferred"
      # The in-container Python loop checks for Django changes without Celery
      # or an external cron. It records only sync runs that change replica data.
      - key: REPLICA_AUTO_SYNC_ENABLED
        value: "true"
      - key: REPLICA_AUTO_SYNC_INTERVAL_SECONDS
        value: "10"

      # ---- Background work: Celery + Redis (see backend/docs/CELERY.md) ----
      # REDIS_URL is injected automatically by Render once the Redis resource
      # is linked to this service, so it is deliberately not declared here.
      #
      # The free plan cannot run a worker (render.yaml rejects `type: worker`
      # with `plan: free`), so bulk imports run inline in this web process.
      # Email delivery does not: see EMAIL_DELIVERY_MODE below.
      - key: CELERY_WORKER_ENABLED
        value: "false"

      # ---- Outbound email (see backend/docs/CELERY.md) ----------------------
      # Keep disabled until a mailbox and sender are configured. Render's free
      # web services block SMTP ports 25/465/587; upgrade this service before
      # enabling SMTP delivery.
      - key: EMAIL_ENABLED
        value: "false"
      # Gmail SMTP defaults; replace EMAIL_HOST for a different mailbox host.
      # For Gmail use an App Password, never the account password.
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # An unset RESEND_API_KEY lets Django use the SMTP settings above.
      # Deferred mail needs the existing scheduled sweeper to deliver queued rows.
      - key: EMAIL_DELIVERY_MODE
        value: "deferred"
      - key: EMAIL_TIMEOUT
        value: "10"
      # Simulation mode lets the deployed demo place orders without collecting payment.
      # ---- AI shopping assistant (server-side Gemini, see PROJECT.md) ------
      # Model used by backend/assistant; must support the Interactions API.
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: ASSISTANT_RETENTION_DAYS
        value: "90"
      # Conversation rate limits for /api/assistant/*.
      - key: THROTTLE_ASSISTANT_ANON_RATE
        value: "15/minute"
      - key: THROTTLE_ASSISTANT_USER_RATE
        value: "30/minute"

      # Secrets — set each via the Render dashboard ("sync: false" values are
      # never stored in source control):
      - key: DJANGO_SECRET_KEY
        sync: false
      # Google AI Studio key. SERVER ONLY: read by Django settings and used
      # exclusively by backend/assistant; never sent to React/Vercel.
      - key: GEMINI_API_KEY
        sync: false
      # Primary Django database connection. For production, supply the
      # validated Supabase PostgreSQL URI here (direct or session pooler,
      # with SSL). SUPABASE_DB_URL below is only the analytics replica.
      - key: DATABASE_URL
        sync: false
      # Optional HTTPS mail transport. When set, it takes precedence over SMTP.
      # Leave unset when using the configured mailbox transport.
      - key: RESEND_API_KEY
        sync: false
      # Long random token presented in the x-sweep-token header by the
      # external cron that calls /api/admin/emails/sweep.
      - key: EMAIL_SWEEP_TOKEN
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # DIRECT Postgres connection string for the analytics replica — Supabase
      # Dashboard -> Project Settings -> Database -> URI. Not the PostgREST URL:
      # the replica lives in its own schema so the anon key in the public
      # bundle cannot read it, and PostgREST only serves `db-schemas` entries.
      - key: SUPABASE_DB_URL
        sync: false
      # Guards POST /api/admin/replica/sync for the external cron. While unset
      # the endpoint returns 404 rather than existing unauthenticated.
      - key: REPLICA_SYNC_TOKEN
        sync: false
      # Demo-data reset. Set "true", wipe once, then set back to "false" --
      # while it is off the page answers 404 and the command refuses to run.
      - key: ENABLE_DATA_RESET
        value: "false"
      # DJANGO_SUPERUSER_* are read by `ensure_superuser`, which the Dockerfile
      # runs on every container start. With no Render Shell on the free plan
      # this is the ONLY way back into the admin if the superuser is lost.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      # Add Daraja credentials manually in the Render dashboard only when
      # switching MPESA_PAYMENT_MODE to "daraja".

# ---------------------------------------------------------------------------
# Worker service — DISABLED on the free plan.
#
# Render's free tier rejects `type: worker` with `plan: free`, so this block is
# shipped commented out. To move bulk imports and email delivery off the web
# process:
#
#   1. Upgrade the blueprint (or this worker) to a paid plan — a worker costs
#      the price of one Starter instance.
#   2. Uncomment the block below.
#   3. Set CELERY_WORKER_ENABLED to "true" on boutique-backend (the web
#      service), so it starts publishing to Redis instead of running inline.
#
# Both services must share the same Redis resource and the same env vars.
